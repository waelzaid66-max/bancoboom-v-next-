# BANCO — generic production Docker Compose (docker-compose.prod.yml)
#
# For generic Docker Compose deployments (non-Coolify). Includes Postgres in
# profile `with-db`; for managed Postgres (cloud DB) omit the profile and
# set DATABASE_URL directly.
#
# Usage:
#   # Full stack including self-hosted Postgres:
#   docker compose -f docker-compose.prod.yml --profile with-db \
#     --env-file .env.production up -d --build
#
#   # With external managed DB (set DATABASE_URL in .env.production):
#   docker compose -f docker-compose.prod.yml \
#     --env-file .env.production up -d --build
#
# Build args for NEXT_PUBLIC_* and VITE_* MUST be present in the env file or
# exported before running docker compose build.

name: banco

networks:
  banco_net:
    driver: bridge

volumes:
  banco_pgdata:
    driver: local

services:

  # ── Postgres 16 (optional — use `--profile with-db`) ─────────────────────
  postgres:
    image: postgres:16
    profiles: ["with-db"]
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-banco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-banco}
    volumes:
      - banco_pgdata:/var/lib/postgresql/data
    networks:
      - banco_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-banco}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── DB migrate (one-off; NEVER runs on `up`) — Coolify parity ─────────────
  #   docker compose -f docker-compose.prod.yml --profile with-db --profile migrate \
  #     --env-file .env.production run --rm migrate
  # When using managed Postgres (no with-db), set DATABASE_URL and:
  #   docker compose -f docker-compose.prod.yml --profile migrate \
  #     --env-file .env.production run --rm migrate
  migrate:
    profiles: ["migrate"]
    build:
      context: .
      dockerfile: deploy/coolify/Dockerfile.api
      target: builder
    restart: "no"
    networks:
      - banco_net
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    # Applies committed migrations in order, once each. Was `push -- --force`
    # — second row of the adoption table in lib/db/MIGRATIONS.md. An existing
    # database must be stamped once before this works:
    #     DATABASE_URL=... pnpm --filter @workspace/db run baseline
    command: ["pnpm", "--filter", "@workspace/db", "run", "migrate"]

  # ── API server ──────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: deploy/coolify/Dockerfile.api
      args:
        GIT_SHA: ${GIT_SHA:-${SOURCE_COMMIT:-}}
        BUILD_ID: ${BUILD_ID:-${SOURCE_COMMIT:-}}
    image: banco-api:latest
    restart: always
    networks:
      - banco_net
    ports:
      # Loopback-only on the host (parity with docker-compose.coolify.yml).
      # The API trusts X-Forwarded-For from the edge proxy; world-binding :8080
      # would let clients spoof client IP. Publish via nginx/Caddy, not raw API.
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?CLERK_SECRET_KEY is required}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      PAYMENT_CONFIG_ENCRYPTION_KEY: ${PAYMENT_CONFIG_ENCRYPTION_KEY:?PAYMENT_CONFIG_ENCRYPTION_KEY is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      PAYMOB_MODE: ${PAYMOB_MODE:-test}
      PAYMOB_API_BASE: ${PAYMOB_API_BASE:-}
      PAYMOB_PUBLIC_KEY: ${PAYMOB_PUBLIC_KEY:-}
      PAYMOB_SECRET_KEY: ${PAYMOB_SECRET_KEY:-}
      PAYMOB_HMAC_SECRET: ${PAYMOB_HMAC_SECRET:-}
      PAYMOB_INTEGRATION_IDS: ${PAYMOB_INTEGRATION_IDS:-}
      # Object storage — REQUIRED in production (API throws if unset / replit on Coolify markers).
      OBJECT_STORAGE_PROVIDER: ${OBJECT_STORAGE_PROVIDER:?OBJECT_STORAGE_PROVIDER is required (use s3)}
      AWS_REGION: ${AWS_REGION:?AWS_REGION is required for S3}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required for S3}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required for S3}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required for S3}
      PUBLIC_OBJECT_SEARCH_PATHS: ${PUBLIC_OBJECT_SEARCH_PATHS:?PUBLIC_OBJECT_SEARCH_PATHS is required}
      PRIVATE_OBJECT_DIR: ${PRIVATE_OBJECT_DIR:?PRIVATE_OBJECT_DIR is required}
      GIT_SHA: ${GIT_SHA:-${SOURCE_COMMIT:-}}
      BUILD_ID: ${BUILD_ID:-${SOURCE_COMMIT:-}}
      ERROR_ALERT_WEBHOOK: ${ERROR_ALERT_WEBHOOK:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CRON_TIMEZONE: ${CRON_TIMEZONE:-Africa/Cairo}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      # Edge proxy → nginx → api = 2 hops (override if topology differs).
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}
    healthcheck:
      test: ["CMD", "node", "-e",
        "fetch('http://127.0.0.1:8080/api/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

  # ── banco-web (FROZEN Next twin — profile-gated; canonical consumer is banco-website)
  # Enable explicitly: docker compose --profile legacy-banco-web up -d
  # Parity with docker-compose.coolify.yml which uses the same profile gate.
  banco-web:
    profiles: ["legacy-banco-web"]
    build:
      context: .
      dockerfile: deploy/coolify/Dockerfile.banco-web
      args:
        # Default http://api:8080 = internal Docker service DNS for SSR rewrites.
        # Override NEXT_PUBLIC_API_URL only if the API is on a separate host/network
        # where the `api` hostname is not resolvable from the Next.js container.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:8080}
        NEXT_PUBLIC_SITE_URL: ${BANCO_WEB_URL:-http://localhost:3000}
        NEXT_PUBLIC_MARKET_URL: ${BANCO_WEB_MARKET_URL:-/market/}
        NEXT_PUBLIC_ADMIN_URL: ${BANCO_WEB_ADMIN_URL:-/admin/}
        NEXT_PUBLIC_APP_ANDROID_URL: ${NEXT_PUBLIC_APP_ANDROID_URL:-}
        NEXT_PUBLIC_APP_IOS_URL: ${NEXT_PUBLIC_APP_IOS_URL:-}
        NEXT_PUBLIC_WEB_SEARCH_LIVE: ${NEXT_PUBLIC_WEB_SEARCH_LIVE:-false}
        NEXT_PUBLIC_WEB_SEARCH_MAP: ${NEXT_PUBLIC_WEB_SEARCH_MAP:-false}
        NEXT_PUBLIC_WEB_MARKET_COPY: ${NEXT_PUBLIC_WEB_MARKET_COPY:-false}
        NEXT_PUBLIC_SEARCH_ENABLED: ${NEXT_PUBLIC_SEARCH_ENABLED:-true}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_CLERK_PROXY_URL: ${NEXT_PUBLIC_CLERK_PROXY_URL:-}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    image: banco-web:latest
    restart: always
    depends_on:
      api:
        condition: service_healthy
    networks:
      - banco_net
    ports:
      - "${BANCO_WEB_HOST_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      NODE_ENV: production
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      WEB_PLUG_ENABLED: ${WEB_PLUG_ENABLED:-true}
    healthcheck:
      test: ["CMD", "node", "-e",
        "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # ── banco-website (marketing Next.js site) ──────────────────────────────────
  banco-website:
    build:
      context: .
      dockerfile: deploy/coolify/Dockerfile.banco-website
      args:
        # Default http://api:8080 = internal Docker service DNS for SSR rewrites.
        # Override NEXT_PUBLIC_API_URL only if the API is on a separate host/network
        # where the `api` hostname is not resolvable from the Next.js container.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:8080}
        NEXT_PUBLIC_SITE_URL: ${BANCO_WEBSITE_URL:-http://localhost:3001}
        # Parity with Coolify + banco-web bake — site-env already reads these.
        NEXT_PUBLIC_MARKET_URL: ${BANCO_WEB_MARKET_URL:-/market/}
        NEXT_PUBLIC_ADMIN_URL: ${BANCO_WEB_ADMIN_URL:-/admin/}
        NEXT_PUBLIC_APP_ANDROID_URL: ${NEXT_PUBLIC_APP_ANDROID_URL:-}
        NEXT_PUBLIC_APP_IOS_URL: ${NEXT_PUBLIC_APP_IOS_URL:-}
        NEXT_PUBLIC_WEB_SEARCH_LIVE: ${NEXT_PUBLIC_WEB_SEARCH_LIVE:-false}
        NEXT_PUBLIC_WEB_SEARCH_MAP: ${NEXT_PUBLIC_WEB_SEARCH_MAP:-false}
        NEXT_PUBLIC_WEB_MARKET_COPY: ${NEXT_PUBLIC_WEB_MARKET_COPY:-false}
        NEXT_PUBLIC_SEARCH_ENABLED: ${NEXT_PUBLIC_SEARCH_ENABLED:-true}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_CLERK_PROXY_URL: ${NEXT_PUBLIC_CLERK_PROXY_URL:-}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    image: banco-website:latest
    restart: always
    depends_on:
      api:
        condition: service_healthy
    networks:
      - banco_net
    ports:
      - "${BANCO_WEBSITE_HOST_PORT:-3001}:3000"
    environment:
      PORT: "3000"
      NODE_ENV: production
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      WEB_PLUG_ENABLED: ${WEB_PLUG_ENABLED:-true}
    healthcheck:
      test: ["CMD", "node", "-e",
        "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # ── web: Nginx + Vite SPAs (landing, dealer-os, admin-os) ───────────────────
  web:
    build:
      context: .
      dockerfile: deploy/coolify/Dockerfile.web
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
        VITE_CLERK_PROXY_URL: ${VITE_CLERK_PROXY_URL:-}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_MARKET_URL: ${VITE_MARKET_URL:-/market/}
        VITE_ADMIN_URL: ${VITE_ADMIN_URL:-/admin/}
        VITE_WEB_URL: ${VITE_WEB_URL:-}
        VITE_APP_ANDROID_URL: ${VITE_APP_ANDROID_URL:-}
        VITE_APP_IOS_URL: ${VITE_APP_IOS_URL:-}
    image: banco-web-static:latest
    restart: always
    depends_on:
      api:
        condition: service_healthy
    networks:
      - banco_net
    ports:
      - "${WEB_HOST_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
