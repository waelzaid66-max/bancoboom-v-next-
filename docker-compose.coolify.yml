# BANCO — Coolify Docker Compose resource (docker-compose.coolify.yml)
#
# ★ START HERE: /release/production/COOLIFY_RUNBOOK.md  (production authority; detailed clicks in /COOLIFY_DEPLOY_NOW.md)
# SoT repo: waelzaid66-max/bancoboom-v-next-  ·  NEVER a historical/pre-consolidation clone
#
# This is the DEFINITIVE compose file for Coolify Docker Compose deployments on
# Hostinger VPS. Point Coolify at this path: docker-compose.coolify.yml
#
# Quick start on Coolify:
#   1. New Resource → Docker Compose → repo bancoboom-v-next-
#      compose file path = docker-compose.coolify.yml
#   2. Set required env vars (see COOLIFY_DEPLOY_NOW.md) BEFORE first Deploy
#   3. Map apex domain to service `web` port 80 (recommended single-origin)
#   4. Start `postgres` and wait for its healthcheck
#   5. Run: docker compose --profile migrate run --rm migrate
#   6. Start `api`, then the web surfaces after API readiness
#
# ─── Service ↔ Image map (DO NOT CONFUSE THESE NAMES) ────────────────────────
#   Service          Image                                  Role
#   postgres         postgres:16                            DB (internal)
#   migrate          (profile migrate)                      one-off committed migrations
#   api              banco-api:${RELEASE_SHA}               API · compose health = /api/readyz
#                                                           (Dockerfile HEALTHCHECK = /api/healthz
#                                                            is image liveness only; compose wins)
#   banco-web        banco-web:${RELEASE_SHA}               Next.js consumer
#   banco-website    banco-website:${RELEASE_SHA}           Next.js marketing/twin
#   web              banco-web-static:${RELEASE_SHA}        Nginx SPAs + /.well-known + /api proxy
#
# RELEASE_SHA is mandatory for every first-party image and must equal the exact
# approved source SHA pinned in Coolify. Never reuse a release tag for different
# image bytes; capture image IDs/RepoDigests per release/production/COOLIFY_RUNBOOK.md.
#
# ─── Network ─────────────────────────────────────────────────────────────────
#   All services share `banco_net`. Inter-service DNS uses the service name
#   (e.g. `api` resolves to the API container from any other container).
#   nginx upstream name `banco_api` is local to nginx.conf — real DNS is `api`.
#
# ─── Environment variables ───────────────────────────────────────────────────
#   Runtime secrets (CLERK_SECRET_KEY, SESSION_SECRET, etc.) are injected by
#   Coolify from its environment variable UI — never committed here.
#   Build-time NEXT_PUBLIC_* / VITE_* args are passed via `build.args` below.
#   See COOLIFY_DEPLOY_NOW.md + docs/DEPLOY_COOLIFY.md.
#
# ─── Migrations ──────────────────────────────────────────────────────────────
#   Committed migrations are NOT run automatically on deploy. Apply them
#   explicitly after Postgres is healthy and before API readiness with the
#   profile-gated one-off `migrate` service:
#       docker compose --profile migrate run --rm migrate
#   A fresh empty database runs `migrate` directly. For an existing pre-journal
#   database, independently prove its live schema is equivalent to the exact
#   committed migration state for the release SHA, then run `baseline` once
#   before `migrate`. Merely being non-empty
#   is not proof. See lib/db/MIGRATIONS.md and docs/DEPLOY_COOLIFY.md.
# ─────────────────────────────────────────────────────────────────────────────

name: banco

networks:
  banco_net:
    driver: bridge

volumes:
  banco_pgdata:
    driver: local

services:

  # ── Postgres 16 ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-banco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-banco}
    volumes:
      - banco_pgdata:/var/lib/postgresql/data
    networks:
      - banco_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-banco}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Postgres is internal-only. Do NOT expose a host port in production.

  # ── DB migrate (one-off; NEVER runs on `up`) ────────────────────────────────
  # Applies committed migrations to Postgres in journal order. Profile-gated so
  # a normal deploy never touches the schema.
  # Run it explicitly after the DB is healthy, once per schema change:
  #   docker compose --profile migrate run --rm migrate
  # Reuses the API builder stage, which contains the committed migration runner.
  # Review generated SQL before commit; production never computes a live schema
  # diff or suppresses a destructive prompt here.
  migrate:
    profiles: ["migrate"]
    build:
      context: .
      dockerfile: deploy/coolify/Dockerfile.api
      target: builder
      args:
        RELEASE_SHA: ${RELEASE_SHA:?RELEASE_SHA is required and must equal the approved exact source SHA}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - banco_net
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-banco}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-banco}
    # Applies committed migrations in order, once each. Was `push -- --force`,
    # which diffed the schema file against the live database and suppressed the
    # prompt that catches a rename — first row of the adoption table in
    # lib/db/MIGRATIONS.md. An existing pre-journal database may be stamped once
    # only after its live schema is independently proven equivalent to the exact
    # committed migration state for the release SHA:
    #     DATABASE_URL=... pnpm --filter @workspace/db run baseline
    command: ["pnpm", "--filter", "@workspace/db", "run", "migrate"]

  # ── API server ───────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: deploy/coolify/Dockerfile.api
      args:
        # One release identity for image tag, build metadata and runtime readiness.
        RELEASE_SHA: ${RELEASE_SHA:?RELEASE_SHA is required and must equal the approved exact source SHA}
    image: banco-api:${RELEASE_SHA:?RELEASE_SHA is required and must equal the approved exact source SHA}
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - banco_net
    # Loopback-only host publish: public traffic must enter via Coolify/Nginx.
    # Binding 0.0.0.0 made express-rate-limit trust spoofable X-Forwarded-For.
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      NODE_ENV: production
      # DATABASE_URL uses the `postgres` service name as hostname (Docker DNS).
      DATABASE_URL: postgresql://${POSTGRES_USER:-banco}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-banco}
      # Auth
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?CLERK_SECRET_KEY is required}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      # Security
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      PAYMENT_CONFIG_ENCRYPTION_KEY: ${PAYMENT_CONFIG_ENCRYPTION_KEY:?PAYMENT_CONFIG_ENCRYPTION_KEY is required}
      # CORS: list of allowed origins (comma-separated public URLs of all frontends).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Set to https://api.example.com whenever Paymob is enabled (charge creation fail-closes without it).
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Integrations (optional — features degrade gracefully when unset)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      PAYMOB_MODE: ${PAYMOB_MODE:-test}
      PAYMOB_API_BASE: ${PAYMOB_API_BASE:-}
      PAYMOB_PUBLIC_KEY: ${PAYMOB_PUBLIC_KEY:-}
      PAYMOB_SECRET_KEY: ${PAYMOB_SECRET_KEY:-}
      PAYMOB_HMAC_SECRET: ${PAYMOB_HMAC_SECRET:-}
      PAYMOB_INTEGRATION_IDS: ${PAYMOB_INTEGRATION_IDS:-}
      # Object storage — REQUIRED on Coolify (production throws if unset / replit).
      # Hostinger VPS has no IAM role — static keys must reach the container.
      OBJECT_STORAGE_PROVIDER: ${OBJECT_STORAGE_PROVIDER:?OBJECT_STORAGE_PROVIDER is required (use s3 on Coolify)}
      AWS_REGION: ${AWS_REGION:?AWS_REGION is required for S3}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required for S3 on Coolify}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required for S3 on Coolify}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required for S3}
      PUBLIC_OBJECT_SEARCH_PATHS: ${PUBLIC_OBJECT_SEARCH_PATHS:?PUBLIC_OBJECT_SEARCH_PATHS is required}
      PRIVATE_OBJECT_DIR: ${PRIVATE_OBJECT_DIR:?PRIVATE_OBJECT_DIR is required}
      # Coolify markers — objectStorageProvider forbids replit when these are set.
      COOLIFY_URL: ${COOLIFY_URL:-}
      COOLIFY_FQDN: ${COOLIFY_FQDN:-}
      # Single runtime release authority. /api/readyz fail-closes on mismatch/malformed identity.
      RELEASE_SHA: ${RELEASE_SHA:?RELEASE_SHA is required and must equal the approved exact source SHA}
      GIT_SHA: ${RELEASE_SHA:?RELEASE_SHA is required and must equal the approved exact source SHA}
      BUILD_ID: ${RELEASE_SHA:?RELEASE_SHA is required and must equal the approved exact source SHA}
      # Observability
      ERROR_ALERT_WEBHOOK: ${ERROR_ALERT_WEBHOOK:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_DIR: ${LOG_DIR:-}
      CRON_TIMEZONE: ${CRON_TIMEZONE:-Africa/Cairo}
      # Pool sizing — keep replicas × DB_POOL_MAX under Postgres max_connections.
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      # Traefik → nginx → api = 2 hops (override if edge topology differs).
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}
    healthcheck:
      test: ["CMD", "node", "-e",
        "fetch('http://127.0.0.1:8080/api/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

  # ── banco-web (FROZEN Next twin — optional; canonical consumer is banco-website)
  # Profile-gated so a default Coolify deploy is api + banco-website + web (nginx).
  # Enable explicitly: docker compose --profile legacy-banco-web up -d
  # Or set COMPOSE_PROFILES=legacy-banco-web in Coolify if you still need the twin.
  banco-web:
    profiles: ["legacy-banco-web"]
    build:
      context: .
      dockerfile: deploy/coolify/Dockerfile.banco-web
      args:
        # NEXT_PUBLIC_API_URL = internal service URL for SSR rewrites.
        # The Next.js SSR runtime calls this directly; browsers use /api/* proxy.
        NEXT_PUBLIC_API_URL: http://api:8080
        # Public-facing URL of THIS app (used for canonical URLs, og:url etc.)
        NEXT_PUBLIC_SITE_URL: ${BANCO_WEB_URL:-http://localhost:3000}
        NEXT_PUBLIC_MARKET_URL: ${BANCO_WEB_MARKET_URL:-}
        NEXT_PUBLIC_ADMIN_URL: ${BANCO_WEB_ADMIN_URL:-}
        NEXT_PUBLIC_APP_ANDROID_URL: ${NEXT_PUBLIC_APP_ANDROID_URL:-}
        NEXT_PUBLIC_APP_IOS_URL: ${NEXT_PUBLIC_APP_IOS_URL:-}
        NEXT_PUBLIC_WEB_SEARCH_LIVE: ${NEXT_PUBLIC_WEB_SEARCH_LIVE:-false}
        NEXT_PUBLIC_WEB_SEARCH_MAP: ${NEXT_PUBLIC_WEB_SEARCH_MAP:-false}
        NEXT_PUBLIC_WEB_MARKET_COPY: ${NEXT_PUBLIC_WEB_MARKET_COPY:-false}
        NEXT_PUBLIC_SEARCH_ENABLED: ${NEXT_PUBLIC_SEARCH_ENABLED:-true}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_CLERK_PROXY_URL: ${NEXT_PUBLIC_CLERK_PROXY_URL:-}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    image: banco-web:${RELEASE_SHA:?RELEASE_SHA is required and must equal the approved exact source SHA}
    restart: always
    depends_on:
      api:
        condition: service_healthy
    networks:
      - banco_net
    ports:
      - "${BANCO_WEB_HOST_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      NODE_ENV: production
      # Runtime-only secrets for Clerk (server-side only, never in the browser bundle)
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      # Kill-switch (web-plug-config) — ops can unplug without image rebuild.
      WEB_PLUG_ENABLED: ${WEB_PLUG_ENABLED:-true}
    healthcheck:
      test: ["CMD", "node", "-e",
        "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # ── banco-website (canonical Next consumer/marketing — see FROZEN.md on banco-web)
  banco-website:
    build:
      context: .
      dockerfile: deploy/coolify/Dockerfile.banco-website
      args:
        NEXT_PUBLIC_API_URL: http://api:8080
        NEXT_PUBLIC_SITE_URL: ${BANCO_WEBSITE_URL:?BANCO_WEBSITE_URL is required for canonical site bake}
        # Parity with banco-web bake args — site-env already reads these; without
        # compose wiring, Coolify builds forever show App Store "soon" even when
        # NEXT_PUBLIC_APP_*_URL secrets are set on the project.
        NEXT_PUBLIC_MARKET_URL: ${BANCO_WEB_MARKET_URL:-/market/}
        NEXT_PUBLIC_ADMIN_URL: ${BANCO_WEB_ADMIN_URL:-/admin/}
        NEXT_PUBLIC_APP_ANDROID_URL: ${NEXT_PUBLIC_APP_ANDROID_URL:-}
        NEXT_PUBLIC_APP_IOS_URL: ${NEXT_PUBLIC_APP_IOS_URL:-}
        NEXT_PUBLIC_WEB_SEARCH_LIVE: ${NEXT_PUBLIC_WEB_SEARCH_LIVE:-false}
        NEXT_PUBLIC_WEB_SEARCH_MAP: ${NEXT_PUBLIC_WEB_SEARCH_MAP:-false}
        NEXT_PUBLIC_WEB_MARKET_COPY: ${NEXT_PUBLIC_WEB_MARKET_COPY:-false}
        NEXT_PUBLIC_SEARCH_ENABLED: ${NEXT_PUBLIC_SEARCH_ENABLED:-true}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is required}
        NEXT_PUBLIC_CLERK_PROXY_URL: ${NEXT_PUBLIC_CLERK_PROXY_URL:-}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    image: banco-website:${RELEASE_SHA:?RELEASE_SHA is required and must equal the approved exact source SHA}
    restart: always
    depends_on:
      api:
        condition: service_healthy
    networks:
      - banco_net
    # Host port 3001 maps to container port 3000 to avoid conflict with banco-web.
    ports:
      - "${BANCO_WEBSITE_HOST_PORT:-3001}:3000"
    environment:
      PORT: "3000"
      NODE_ENV: production
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      WEB_PLUG_ENABLED: ${WEB_PLUG_ENABLED:-true}
    healthcheck:
      test: ["CMD", "node", "-e",
        "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # ── web: Vite SPAs via Nginx (landing, dealer-os, admin-os) ─────────────────
  web:
    build:
      context: .
      dockerfile: deploy/coolify/Dockerfile.web
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?VITE_CLERK_PUBLISHABLE_KEY is required for SPA bake}
        VITE_CLERK_PROXY_URL: ${VITE_CLERK_PROXY_URL:-}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_MARKET_URL: ${VITE_MARKET_URL:-/market/}
        VITE_ADMIN_URL: ${VITE_ADMIN_URL:-/admin/}
        VITE_WEB_URL: ${VITE_WEB_URL:-}
        VITE_APP_ANDROID_URL: ${VITE_APP_ANDROID_URL:-}
        VITE_APP_IOS_URL: ${VITE_APP_IOS_URL:-}
    image: banco-web-static:${RELEASE_SHA:?RELEASE_SHA is required and must equal the approved exact source SHA}
    restart: always
    depends_on:
      api:
        condition: service_healthy
    networks:
      - banco_net
    ports:
      - "${WEB_HOST_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s