name: Deploy (AWS)

# CD for AWS production. Gated on the same checks as CI, then ECR push + SSM deploy.
# Prefer deploying from **aws-virgen** (EC2 clone path). This workflow also exists on
# the primary monorepo for parity.
#
# Required secrets/vars: AWS_ROLE_ARN, AWS_REGION, ECR_REGISTRY, EC2_INSTANCE_ID, SSM_PREFIX
# Build-time vars: VITE_CLERK_PUBLISHABLE_KEY, VITE_API_BASE_URL

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or SHA to deploy"
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  verify:
    name: Verify (typecheck + tests)
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.sha }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: banco_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/banco_test
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - name: Resolve immutable deployment candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          if [[ ! "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid candidate SHA: $candidate_sha" >&2
            exit 1
          fi
          echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - name: Production dependency security gate
        run: pnpm run security:audit
      # Production deploy must not skip mobile static gates (parity with ci.yml).
      - name: Mobile static regression (full pack)
        run: pnpm --filter @workspace/banco-mobile run test
      - name: Demo seed production guard (static)
        run: pnpm --filter @workspace/api-server run test:seed-guard
      - name: Prepare test DB
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          pnpm --filter @workspace/db run check
          pnpm --filter @workspace/db run migrate
          pnpm --filter @workspace/db run migrate
          pnpm --filter @workspace/api-server run seed
      - run: pnpm --filter @workspace/api-server run test

  build-and-push:
    name: Build + push images to ECR
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.candidate_sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build + push API
        env:
          CANDIDATE_SHA: ${{ needs.verify.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          TAG="$CANDIDATE_SHA"
          docker build -f deploy/aws/Dockerfile.api \
            --build-arg GIT_SHA="$CANDIDATE_SHA" \
            --build-arg BUILD_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -t "${{ vars.ECR_REGISTRY }}/banco-api:$TAG" .
          docker push "${{ vars.ECR_REGISTRY }}/banco-api:$TAG"
      - name: Build + push Web
        env:
          CANDIDATE_SHA: ${{ needs.verify.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          TAG="$CANDIDATE_SHA"
          docker build -f deploy/aws/Dockerfile.web \
            --build-arg VITE_CLERK_PUBLISHABLE_KEY="${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}" \
            --build-arg VITE_API_BASE_URL="${{ vars.VITE_API_BASE_URL }}" \
            -t "${{ vars.ECR_REGISTRY }}/banco-web:$TAG" .
          docker push "${{ vars.ECR_REGISTRY }}/banco-web:$TAG"

  deploy:
    name: Deploy on EC2 (SSM)
    needs: [verify, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Trigger deploy.sh on the host
        env:
          CANDIDATE_SHA: ${{ needs.verify.outputs.candidate_sha }}
          DEPLOY_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          AWS_REGION_VALUE: ${{ vars.AWS_REGION }}
          SSM_PREFIX_VALUE: ${{ vars.SSM_PREFIX }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid candidate SHA: $CANDIDATE_SHA" >&2
            exit 1
          fi
          printf -v REMOTE_COMMAND \
            'cd /opt/banco/aws-virgen && git fetch --all --tags && git checkout --detach %q && GIT_SHA=%q BUILD_ID=%q AWS_REGION=%q SSM_PREFIX=%q bash deploy/aws/scripts/deploy.sh' \
            "$CANDIDATE_SHA" "$CANDIDATE_SHA" "$DEPLOY_BUILD_ID" "$AWS_REGION_VALUE" "$SSM_PREFIX_VALUE"
          PARAMETERS="$(jq -cn --arg command "$REMOTE_COMMAND" '{commands: [$command]}')"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "BANCO deploy ${CANDIDATE_SHA}" \
            --parameters "$PARAMETERS" \
            --region "${{ vars.AWS_REGION }}" \
            --query 'Command.CommandId' \
            --output text)
          echo "SSM CommandId=${COMMAND_ID}"
          aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --region "${{ vars.AWS_REGION }}"
          STATUS=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --region "${{ vars.AWS_REGION }}" \
            --query 'Status' \
            --output text)
          echo "SSM Status=${STATUS}"
          if [ "${STATUS}" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --region "${{ vars.AWS_REGION }}" \
              --query '{Status:Status,StatusDetails:StatusDetails,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
              --output json || true
            exit 1
          fi
