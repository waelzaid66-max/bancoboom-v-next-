packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

allowBuilds:
  '@clerk/shared': true
  browser-tabs-lock: true
  core-js: true
  dtrace-provider: false
  esbuild: true
  sharp: true

autoInstallPeers: false

# Expo SDK 54 is pinned by Expo to React 19.1.0. The Clerk versions currently
# locked by this release support React 19.1 at runtime, but their post-security
# peer ranges start at 19.1.4. Keep this exception version-scoped so any Clerk
# upgrade reopens the compatibility gate instead of silently inheriting it.
# Clerk's dormant wallet adapters also declare Solana/bs58 peers. The app does
# not import those adapters; production-confidence-check rejects any future
# direct import before these missing optional peers can become a runtime gap.
peerDependencyRules:
  ignoreMissing:
    - '@solana/web3.js'
    - bs58
  allowedVersions:
    '@clerk/react@6.10.0>react': 19.1.0
    '@clerk/react@6.10.0>react-dom': 19.1.0
    '@clerk/shared@3.47.7>react': 19.1.0
    '@clerk/shared@3.47.7>react-dom': 19.1.0
    '@clerk/shared@4.18.0>react': 19.1.0
    '@clerk/shared@4.18.0>react-dom': 19.1.0
    '@clerk/nextjs@6.39.5>react': 19.1.0
    '@clerk/nextjs@6.39.5>react-dom': 19.1.0
    '@clerk/clerk-react@5.61.8>react': 19.1.0
    '@clerk/clerk-react@5.61.8>react-dom': 19.1.0

catalog:
  '@replit/vite-plugin-cartographer': ^0.5.1
  '@replit/vite-plugin-dev-banner': ^0.1.1
  '@replit/vite-plugin-runtime-error-modal': ^0.0.6
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  next: 15.5.21
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: 4.21.0
  vite: ^7.3.2
  wouter: ^3.3.5
  zod: 3.25.76

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@replit/*'
  - stripe-replit-sync

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

overrides:
  'brace-expansion@<2.0.0': '1.1.18'
  'brace-expansion@>=2.0.0 <3.0.0': '2.1.4'
  'brace-expansion@>=3.0.0': '5.0.9'
  # Security-bump overrides carry an upper bound on purpose. An open '>=x' lets
  # a future major in with no review step: it is not caught by the audit gate
  # (a newer major is not "vulnerable"), and the lockfile hides it until someone
  # re-resolves from scratch. uuid demonstrates the failure mode - a declared
  # floor of '>=11.1.1' had silently absorbed three majors and installs 14.0.0.
  # Bound each to the major it was written for; widening is then a deliberate,
  # reviewable edit. None of these bounds changes a resolved version today.
  tar: '>=7.5.17 <8'
  markdown-it: '^14.2.0'
  '@babel/core': '7.29.6'
  '@esbuild-kit/esm-loader': npm:tsx@^4.21.0
  '@expo/ngrok-bin>@expo/ngrok-bin-darwin-arm64': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-darwin-x64': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-freebsd-ia32': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-freebsd-x64': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-linux-arm': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-linux-arm64': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-linux-ia32': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-sunos-x64': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-win32-ia32': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-win32-x64': '-'
  # Lock @expo/vector-icons to the Expo SDK 54 baseline (exact, no caret) so no
  # transitive dep can ever pull a 2nd version. A version mismatch makes the JS
  # glyph map point at a wrong-version TTF → app-wide .notdef/tofu icons on
  # Android. Exact pin also bypasses minimumReleaseAge. Guarded by
  # banco-mobile/tests/icons.test.mjs (single-version assertion).
  '@expo/vector-icons': '15.0.3'
  '@tailwindcss/oxide>@tailwindcss/oxide-android-arm64': '-'
  '@tailwindcss/oxide>@tailwindcss/oxide-darwin-arm64': '-'
  '@tailwindcss/oxide>@tailwindcss/oxide-darwin-x64': '-'
  '@tailwindcss/oxide>@tailwindcss/oxide-freebsd-x64': '-'
  '@tailwindcss/oxide>@tailwindcss/oxide-linux-arm-gnueabihf': '-'
  '@tailwindcss/oxide>@tailwindcss/oxide-linux-arm64-gnu': '-'
  '@tailwindcss/oxide>@tailwindcss/oxide-linux-arm64-musl': '-'
  '@tailwindcss/oxide>@tailwindcss/oxide-linux-x64-musl': '-'
  '@tailwindcss/oxide>@tailwindcss/oxide-win32-arm64-msvc': '-'
  '@tailwindcss/oxide>@tailwindcss/oxide-win32-x64-msvc': '-'
  esbuild: '0.28.1'
  fast-uri: '3.1.5'
  form-data: '2.5.6'
  ip-address: '10.3.1'
  js-yaml: '4.3.1'
  # GHSA-2V37-7H3G-55P8 (high): a custom generator can loop indefinitely when
  # size is zero. Patched in 3.3.18. This REPLACES the earlier targeted pin
  # 'nanoid@3.3.12': '3.3.17', which answered the previous advisory (patched
  # >=3.3.16) but is itself inside the new vulnerable range (<3.3.18).
  #
  # Replaced rather than supplemented: pnpm gives a `pkg@version` override
  # precedence over a general one, so a blanket line added beside the targeted
  # pin would have left the 3.3.17 and 3.3.8 requesters on vulnerable copies
  # while looking correct in review.
  #
  # The upper bound is load-bearing here in a way it is not for tar/qs, where
  # the patched line IS the current major. 3.3.18 is only the `legacy` tag;
  # `latest` is 6.0.1 and nanoid >=4 is ESM-only, so an unbounded '>=3.3.18'
  # resolves to 6.0.1 on a clean resolve (verified) and breaks the CommonJS
  # require in postcss and @react-navigation. It would pass every gate and fail
  # only on the next from-scratch resolution, because the lockfile already holds
  # a satisfying 3.3.18 entry.
  #
  # 3.x is also where canonical already had every requester: vite declares
  # nanoid ^5.1.6 yet resolved to 3.3.17 before this change.
  #
  # nanoid reaches the mobile RUNTIME via @react-navigation/core, so this is
  # resolved rather than waived - and the gate has no generic waiver list.
  nanoid: '>=3.3.18 <4'
  postcss: '8.5.23'
  qs: '>=6.15.2 <7'
  sharp: '0.35.0'
  shell-quote: '1.9.0'
  undici: '6.28.0'
  # Bound at <15 to pin the major this tree actually installs (14.0.0), not the
  # 11.1.1 the floor was written for - the open range had already absorbed three
  # majors unreviewed. <15 is chosen over <12 deliberately: it changes nothing
  # today, whereas dropping back to 11.x would be a real downgrade. Verified
  # that 14 keeps a CommonJS entry (exports."." carries a `node` condition) and
  # the full v9 API surface consumers declare (v1 v3 v4 v5 NIL parse stringify
  # validate version), so no requester is broken by staying on 14.
  uuid: '>=11.1.1 <15'
  vite: '7.3.5'
  ws: '8.21.0'
