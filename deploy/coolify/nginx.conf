# BANCO Coolify — Nginx: serves Vite SPAs and reverse-proxies /api/ + SEO to the API.
#
# Path routing (single origin, Coolify reverse proxy / Traefik in front):
#   /          → landing SPA   (artifacts/landing, built with BASE_PATH=/)
#   /market/   → dealer-os SPA (artifacts/dealer-os, built with BASE_PATH=/market/)
#   /admin/    → admin-os SPA  (artifacts/admin-os, built with BASE_PATH=/admin/)
#   /api/      → api:8080      (REST)
#   /l/ /listing/ /sitemap.xml /robots.txt → api:8080 (share/SEO — MUST NOT hit SPA)
#   /nginx-health → 200 ok     (container liveness probe)
#
# The upstream name `banco_api` resolves to the `api` Docker Compose service via
# the internal `banco_net` network. Change `server api:8080` if your API service
# is named differently in docker-compose.coolify.yml.

upstream banco_api {
    server api:8080;
    keepalive 32;
}

# Prefer Traefik/Coolify's original proto when present; fall back to $scheme
# (listen 80 alone would otherwise force http and break cookies / absolute URLs).
map $http_x_forwarded_proto $banco_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types
    text/plain text/css text/javascript application/javascript
    application/json application/xml image/svg+xml font/woff2;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 60 MB body limit (for listing media uploads). Raise both here AND in the
    # API's own guard if the media policy changes.
    client_max_body_size 60m;

    # Security headers (defence in depth).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;

    # Container liveness probe (used by Docker HEALTHCHECK + Coolify).
    location = /nginx-health { access_log off; return 200 "ok\n"; }

    # ---- Universal Links / App Links (AASA + Digital Asset Links) ----------
    # Served from deploy/coolify/well-known/ (copied into the image). OPS must
    # replace REPLACE_* placeholders with Apple Team ID + Play signing SHA-256
    # before store verification will succeed. No redirects.
    # Use default_type only — do not also add_header Content-Type (duplicate MIME).
    location ^~ /.well-known/ {
        default_type application/json;
        try_files $uri =404;
    }

    # ---- Shared proxy headers (API + SEO) -----------------------------------
    # X-Forwarded-For keeps the original client when Traefik already set it;
    # X-Real-IP is the immediate peer (usually Traefik).
    # X-Forwarded-Proto preserves https through Traefik → nginx → api.

    # ---- API reverse proxy --------------------------------------------------
    # Forwards /api/* requests to the API container. The browser never needs
    # the internal API hostname — it calls /api/* through this proxy.
    location /api/ {
        proxy_pass         http://banco_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $banco_forwarded_proto;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
        proxy_buffering    off;
    }

    # ---- SEO / share surfaces (MUST be before SPA `location /`) -------------
    # Without these, apex→web serves landing index.html for /l/* and breaks OG.
    location ^~ /l/ {
        proxy_pass         http://banco_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $banco_forwarded_proto;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
    }

    location ^~ /listing/ {
        proxy_pass         http://banco_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $banco_forwarded_proto;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
    }

    location = /sitemap.xml {
        proxy_pass         http://banco_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $banco_forwarded_proto;
        proxy_set_header   Connection        "";
    }

    location = /robots.txt {
        proxy_pass         http://banco_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $banco_forwarded_proto;
        proxy_set_header   Connection        "";
    }

    # ---- Hashed static assets: cache aggressively --------------------------
    # Vite content-hashes all asset filenames so 1-year cache is safe.
    location /assets/        { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location /admin/assets/  { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location /market/assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }

    # ---- admin SPA (/admin/) ------------------------------------------------
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # ---- market / dealer-os SPA (/market/) ----------------------------------
    location /market/ {
        try_files $uri $uri/ /market/index.html;
    }

    # Legacy Replit path aliases → Coolify map (bookmarks + old landing CTAs).
    location = /dealer-os { return 301 /market/; }
    location /dealer-os/  { return 301 /market/; }
    location = /admin-os  { return 301 /admin/; }
    location /admin-os/   { return 301 /admin/; }

    # ---- landing SPA (root /) -----------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
